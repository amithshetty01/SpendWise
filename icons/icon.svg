<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="120" fill="#0f382c"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Main Wallet Container -->
  <rect x="96" y="140" width="320" height="232" rx="28" fill="url(#grad)" />
  <!-- Wallet Top Fold Accent -->
  <path d="M 120 140 Q 256 180 392 140" stroke="#0f382c" stroke-width="12" fill="none" opacity="0.2"/>
  <!-- Card Pocket Lip -->
  <rect x="136" y="100" width="240" height="60" rx="16" fill="#0b281f" opacity="0.6"/>
  <rect x="156" y="116" width="200" height="40" rx="12" fill="url(#gold)" opacity="0.9"/>
  <!-- Wallet Clasp Button -->
  <circle cx="340" cy="256" r="32" fill="#0f382c" />
  <circle cx="340" cy="256" r="22" fill="#34d399" />
  <circle cx="340" cy="256" r="10" fill="#ffffff" />
  <!-- Currency symbol / trend line -->
  <path d="M 156 280 L 196 240 L 236 260 L 290 200" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 264 200 L 290 200 L 290 226" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
